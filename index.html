<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Brusque - Infantil</title>
  </head>
  <body>
    <main>
      <!-- audio de fundo -->

      <audio id="musica-fundo" loop>
        <source src="./assets/music/background-audio.mpeg" type="audio/mpeg" />
      </audio>

      <!-- tela inicial -->

      <section id="tela-inicio">
        <div id="controles-superiores">
          <button id="btn-som" type="button">
            <img src="./assets/music/icon music.png" alt="Liga/Desliga Som" />
          </button>
        </div>

        <h1>Aventuras em Brusque</h1>

        <form id="form-inicial">
          <div class="container-campo-entrada">
            <div class="campo-entrada">
              <img src="./assets/img-tela-inicial/lapes icon.png" alt="Lápis" />
              <input
                type="text"
                id="nome-aluno"
                placeholder="Nome"
                autocomplete="off"
                required
              />
            </div>
            <div class="campo-entrada">
              <img
                src="./assets/img-tela-inicial/escola icon.png"
                alt="Escola"
              />
              <input
                type="text"
                id="escola"
                placeholder="Escola"
                autocomplete="off"
                required
              />
            </div>
          </div>
          <div id="selecao-idade">
            <span>Idade:</span>
            <button type="button" class="btn-idade" required>4</button>
            <button type="button" class="btn-idade" required>5</button>
            <button type="button" class="btn-idade" required>6</button>
          </div>
          <button id="btn-jogar" type="submit">
            <img src="./assets/img-tela-inicial/btn_play.png" alt="Play" />
            <span>Jogar</span>
          </button>
        </form>
      </section>

      <!-- inicio quiz -->

      <section id="tela-quiz">
        <div id="topo-quiz">
          <div id="placa-pergunta">
            <img
              src="./assets/img-tela-quiz/img_placa.png"
              alt="Placa de Pergunta"
              class="img-placa"
            />
            <span class="texto-placa">PERGUNTA 1 DE 15</span>
          </div>

          <div id="container-progresso">
            <div id="barra-fundo">
              <div id="barra-progresso"></div>
            </div>
            <img
              src="./assets/img-tela-quiz/trofeu.png"
              alt="Troféu"
              id="icone-trofeu"
            />
          </div>

          <button id="btn-som-quiz" type="button">
            <img src="./assets/music/icon music.png" alt="Liga/Desliga Som" />
          </button>
        </div>

        <div id="container-quadro-quiz">
          <img
            src="./assets/img-tela-quiz/quadro_fundo.png"
            alt="Quadro de Fundo"
            class="img-quadro-madeira"
          />

          <div id="conteudo-quiz-interno">
            <div class="header-pergunta">
              <h2 id="pergunta">
                1. Qual é o animalzinho que dá nome à festa mais famosa de
                Brusque, a Fenarreco?
              </h2>
            </div>

            <div id="opcoes">
              <button class="opcao" id="opt-1"type="button">
                <img
                  src="./assets/img-tela-quiz/pergunta_1/imgLeao.png"
                  alt="Leão"
                />
              </button>
              <button class="opcao" id="opt-2" type="button">
                <img
                  src="./assets/img-tela-quiz/pergunta_1/imgVaca.png"
                  alt="Vaca"
                />
              </button>
              <button class="opcao" id="opt-3" type="button">
                <img
                  src="./assets/img-tela-quiz/pergunta_1/imgMarreco.png"
                  alt="Marreco"
                />
              </button>
              <button class="opcao" id="opt-4" type="button">
                <img
                  src="./assets/img-tela-quiz/pergunta_1/imgPato.png"
                  alt="Pato"
                />
              </button>
            </div>
          </div>
        </div>

        <button id="btn-proximo" type="button">
          PRÓXIMO
          <img src="./assets/img-tela-quiz/btn_proximo.png" alt="Próximo" />
        </button>
      </section>
    </main>
  </body>
</html>
