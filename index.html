<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Brusque - Infantil</title>
    <link rel="stylesheet" href="css/animacoes.css">
    <link rel="stylesheet" href="./css/geral.css" />
    <link rel="stylesheet" href="./css/inicio.css" />
    <link rel="stylesheet" href="./css/quiz.css" />
    <link rel="stylesheet" href="./css/resultado.css" />
  </head>
  <body>
    <main>
      <!-- audio de fundo -->

      <audio id="musica-fundo" loop>
        <source src="./assets/music/background-audio.mpeg" type="audio/mpeg" />
      </audio>

      <!-- tela inicial -->

      <section id="tela-inicio">
        <div id="controles-superiores">
          <button id="btn-som" type="button">
            <img src="./assets/music/icon music.png" alt="Liga/Desliga Som" />
          </button>
        </div>

        <h1>Aventuras em Brusque</h1>

        <form id="form-inicial">
          <div class="container-campo-entrada">
            <div class="campo-entrada">
              <img src="./assets/img-tela-inicial/lapes icon.png" alt="Lápis" />
              <input
                type="text"
                id="nome-aluno"
                placeholder="Nome"
                autocomplete="off"
                required
              />
            </div>
            <div class="campo-entrada">
              <img
                src="./assets/img-tela-inicial/escola icon.png"
                alt="Escola"
              />
              <input
                type="text"
                id="escola"
                placeholder="Escola"
                autocomplete="off"
                required
              />
            </div>
          </div>
          <div id="selecao-idade">
            <span>Idade:</span>
            <button type="button" class="btn-idade">4</button>
            <button type="button" class="btn-idade">5</button>
            <button type="button" class="btn-idade">6</button>
          </div>
          <button id="btn-jogar" type="button">
            <img src="./assets/img-tela-inicial/btn_play.png" alt="Play" />
            <span>Jogar</span>
          </button>
        </form>
      </section>

      <!-- inicio quiz -->

      <section id="tela-quiz" style="display: none">
        <div id="topo-quiz">
          <div id="placa-pergunta">
            <img
              src="./assets/img-tela-quiz/img_placa.png"
              alt="Placa de Pergunta"
              class="img-placa"
            />
            <span class="texto-placa">PERGUNTA 1 DE 15</span>
          </div>

          <div id="container-progresso">
            <div id="barra-fundo">
              <div id="barra-progresso"></div>
            </div>
            <img
              src="./assets/img-tela-quiz/trofeu.png"
              alt="Troféu"
              id="icone-trofeu"
            />
          </div>

          <button id="btn-som-quiz" type="button">
            <img src="./assets/music/icon music.png" alt="Liga/Desliga Som" />
          </button>
        </div>

        <div id="container-quadro-quiz">
          <img
            src="./assets/img-tela-quiz/quadro_fundo.png"
            alt="Quadro de Fundo"
            class="img-quadro-madeira"
          />

          <div id="conteudo-quiz-interno">
            <div class="header-pergunta">
              <h2 id="pergunta">
                1. Qual é o animalzinho que dá nome à festa mais famosa de
                Brusque, a Fenarreco?
              </h2>
            </div>

            <div id="opcoes">
              <button class="opcao" id="opt-1" type="button">
                <img
                  src="./assets/img-tela-quiz/pergunta_1/imgLeao.png"
                  alt="Leão"
                />
                <img
                  src="./assets/img-feedback/V_correto.png"
                  class="feedback-icon icone-v"
                  style="display: none"
                />
                <img
                  src="./assets/img-feedback/X_erro.png"
                  class="feedback-icon icone-x"
                  style="display: none"
                />
              </button>
              <button class="opcao" id="opt-2" type="button">
                <img
                  src="./assets/img-tela-quiz/pergunta_1/imgVaca.png"
                  alt="Vaca"
                />
                <img
                  src="./assets/img-feedback/V_correto.png"
                  class="feedback-icon icone-v"
                  style="display: none"
                />
                <img
                  src="./assets/img-feedback/X_erro.png"
                  class="feedback-icon icone-x"
                  style="display: none"
                />
              </button>
              <button class="opcao" id="opt-3" type="button">
                <img
                  src="./assets/img-tela-quiz/pergunta_1/imgMarreco.png"
                  alt="Marreco"
                />
                <img
                  src="./assets/img-feedback/V_correto.png"
                  class="feedback-icon icone-v"
                  style="display: none"
                />
                <img
                  src="./assets/img-feedback/X_erro.png"
                  class="feedback-icon icone-x"
                  style="display: none"
                />
              </button>
              <button class="opcao" id="opt-4" type="button">
                <img
                  src="./assets/img-tela-quiz/pergunta_1/imgPato.png"
                  alt="Pato"
                />
                <img
                  src="./assets/img-feedback/V_correto.png"
                  class="feedback-icon icone-v"
                  style="display: none"
                />
                <img
                  src="./assets/img-feedback/X_erro.png"
                  class="feedback-icon icone-x"
                  style="display: none"
                />
              </button>
            </div>
          </div>
        </div>

        <button id="btn-proximo" type="button">
          PRÓXIMO
          <img src="./assets/img-tela-quiz/btn_proximo.png" alt="Próximo" />
        </button>
      </section>

      <!-- tela resultados -->

      <section id="tela-resultado" style="display: none">
        <div id="container-vitoria">
          <h1 id="titulo-vitoria">PARABÉNS, CAMPEÃO!</h1>

          <img
            src="./assets/img-tela-resultado/trofeu_grande.png"
            id="trofeu-vitoria"
            alt="Troféu Sorridente"
          />
          <div id="base-pedra">
            <img
              src="./assets/img-tela-resultado/pedra_fundo.png"
              alt="Base de Pedra"
            />

            <div class="texto-resultado">
              <p>VOCÊ ACERTOU</p>
              <h2 id="pontuacao-final">15 de 15 PERGUNTAS</h2>
            </div>
            <button
              id="btn-menu-principal"
              type="button"
              onclick="location.reload()"
            >
              <img
                src="./assets/img-tela-resultado/icone_casa.png"
                alt="Início"
              />
              <span>Menu Principal</span>
            </button>
          </div>
        </div>
      </section>

      <audio id="audio-player"></audio>
    </main>
    <script src="./js/script.js"></script>
  </body>
</html>
